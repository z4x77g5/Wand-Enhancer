name: Import Deyyess MP3 for Carrd
on:
  push:
    branches: [master]
    paths: [".github/workflows/import-deyyess-mp3.yml"]
permissions:
  contents: write
jobs:
  import-mp3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public MP3
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet gdown
          mkdir -p carrd-assets
          gdown "https://drive.google.com/uc?id=1fOxv4ipIzB2W4-yAT3XHZGuahPFP5FsT" -O carrd-assets/deyyess-would-you-go-down-on-a-girl.mp3
          test "$(wc -c < carrd-assets/deyyess-would-you-go-down-on-a-girl.mp3)" -gt 3000000
          file carrd-assets/deyyess-would-you-go-down-on-a-girl.mp3
      - name: Save song
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add carrd-assets/deyyess-would-you-go-down-on-a-girl.mp3
          git diff --cached --quiet && exit 0
          git commit -m "Add audio for Carrd player"
          git push
