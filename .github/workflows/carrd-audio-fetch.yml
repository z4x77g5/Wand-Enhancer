name: Fetch Carrd audio

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/carrd-audio-fetch.yml"

permissions:
  contents: write

jobs:
  fetch-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch audio from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p carrd-assets
          curl -fL --retry 3 --retry-delay 2 \
            "https://drive.usercontent.google.com/download?id=1Dn2DQwWzg6jg9os1wMUQRZGLBl9uMPT9&export=download&confirm=t" \
            -o carrd-assets/idealism-nagashi.mp3
          test "$(wc -c < carrd-assets/idealism-nagashi.mp3)" -gt 1000000
          file carrd-assets/idealism-nagashi.mp3

      - name: Commit audio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add carrd-assets/idealism-nagashi.mp3
          git diff --cached --quiet && exit 0
          git commit -m "Add Carrd audio asset"
          git push
